views:
  - name: q12_survey_response_metrics
    title: Q12调研答卷指标
    description: Q12总体、四层和十二项得分及正向作答结构的权限受控查询入口。
    meta:
      query_surface: metric_source
      time_source: survey
      default_population_scope: 统计范围：公开虚构数据中完成最近一期Q12答卷的员工。
    access_policy:
      - groups: [pa_full, pa_service]
        member_level:
          includes: &members
            [year, month, period_month, wave_id, wave_name, wave_month, legal_entity_name, organization_name, department_name, work_location, employment_type, gender, age_band, tenure_band, job_family_name, job_title, job_level_band, q12_respondent_count, q12_answered_item_count, q12_favorable_item_count, q12_strongly_agree_item_count, q12_average_score, q12_basic_needs_score, q12_individual_contribution_score, q12_teamwork_score, q12_growth_score, q01_score, q02_score, q03_score, q04_score, q05_score, q06_score, q07_score, q08_score, q09_score, q10_score, q11_score, q12_score]
        row_level: { allow_all: true }
      - group: pa_scoped
        member_level: { includes: *members }
        row_level:
          filters:
            - { member: organization_name, operator: equals, values: securityContext.org_scope }
    cubes:
      - join_path: q12_survey_response_fact
        includes: *members
