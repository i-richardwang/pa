views:
  - name: employee_leave_metrics
    title: 员工离职指标执行面
    description: 员工离职事件指标的权限受控执行面。
    meta:
      query_surface: metric_source
      time_source: workforce
      default_population_scope: 统计范围：公开虚构数据中的示例员工。
    access_policy:
      - groups: [pa_full, pa_service]
        member_level:
          includes: &members
            [year, month, period_month, legal_entity_name, organization_name, department_name, work_location, employment_type, gender, age_band, tenure_band, job_family_name, job_title, job_level_band, leave_type, separation_count, voluntary_separation_count, involuntary_separation_count, other_separation_count]
        row_level: { allow_all: true }
      - group: pa_scoped
        member_level: { includes: *members }
        row_level:
          filters:
            - { member: organization_name, operator: equals, values: securityContext.org_scope }
    cubes:
      - join_path: employee_leave_event_fact
        includes: *members
