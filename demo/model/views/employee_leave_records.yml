views:
  - name: employee_leave_records
    title: 离职员工记录
    description: 所选期间构成离职人数的员工记录。
    meta:
      query_surface: detail
      time_source: workforce
      observation_scope: 统计范围：公开虚构数据中的示例员工。
      record_sets:
        termination_event:
          title: 离职员工
          description: 所选期间构成离职人数的虚构员工记录。
          record_key: record_key
          entity_key: employee_id
          fields:
            - { member: employee_id }
            - { member: employee_name }
            - { member: record_date, title: 离职日期 }
            - { member: legal_entity_name }
            - { member: organization_name }
            - { member: department_name }
            - { member: work_location }
            - { member: employment_type }
            - { member: gender }
            - { member: age_band }
            - { member: tenure_band }
            - { member: job_family_name }
            - { member: job_title }
            - { member: job_level_band }
            - { member: leave_type }
          entity_order:
            - { member: record_date, direction: desc }
            - { member: record_key, direction: desc }
    access_policy:
      - groups: [pa_full, pa_service]
        member_level: { includes: "*" }
        row_level: { allow_all: true }
      - group: pa_scoped
        member_level: { includes: "*" }
        row_level:
          filters:
            - { member: organization_name, operator: equals, values: securityContext.data_scope.values }
    cubes:
      - join_path: employee_leave_event_fact
        includes: "*"
