views:
  - name: workforce_exposure_metrics
    title: 在职人月
    description: 各月在职员工形成的人月，用于计算期间平均人数。
    meta:
      query_surface: metric_source
      time_source: workforce
      observation_scope: 统计范围：公开虚构数据中的示例员工。
    access_policy:
      - groups: [pa_full, pa_service]
        member_level:
          includes: &members
            [year, month, period_month, legal_entity_name, organization_name, department_id, department_name, work_location, employment_type, gender, age_band, tenure_band, job_family_name, job_title, job_level_band, workforce_exposure]
        row_level: { allow_all: true }
      - group: pa_scoped
        member_level: { includes: *members }
        row_level:
          filters:
            - { member: organization_name, operator: equals, values: securityContext.data_scope.values }
    cubes:
      - join_path: workforce_month_exposure_fact
        includes: *members
