views:
  - name: headcount_plan_metrics
    title: 编制计划指标执行面
    description: 月度编制计划指标的权限受控执行面。
    meta:
      query_surface: metric_source
      time_source: headcount_plan
      time_anchor_measure: planned_headcount
      observation_scope: 统计范围：公开虚构数据中的示例员工。
    access_policy:
      - groups: [pa_full, pa_service]
        member_level:
          includes: &members
            [year, month, period_month, legal_entity_name, organization_name, department_name, planned_headcount]
        row_level: { allow_all: true }
      - group: pa_scoped
        member_level: { includes: *members }
        row_level:
          filters:
            - { member: organization_name, operator: equals, values: securityContext.data_scope.values }
    cubes:
      - join_path: department_headcount_plan_fact
        includes: *members
