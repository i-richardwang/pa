cubes:
  - name: department_headcount_plan_fact
    title: 部门编制计划
    public: false
    description: 公开演示数据中每个部门每月一行的计划编制事实。
    sql: "SELECT * FROM read_parquet('/semantic/current/department_headcount_plan_fact.parquet')"
    dimensions:
      - name: record_key
        sql: record_key
        type: string
        primary_key: true
        public: false
        meta: { internal: true, member_role: relationship_key }
      - name: year
        title: 年
        description: 数据记录所属的自然年。
        sql: year
        type: number
        public: false
        meta: { internal: true, member_role: time_control }
      - name: month
        title: 月
        description: 数据记录所属自然年中的月份序号。
        sql: month
        type: number
        public: false
        meta: { internal: true, member_role: time_control }
      - name: period_month
        title: 月份
        description: 数据记录所属月份的时间轴。
        sql: period_month
        type: time
        public: false
        meta: { internal: true, member_role: time_control }
      - name: legal_entity_name
        title: 法人实体
        description: 员工雇佣关系所属的法人实体。
        sql: legal_entity_name
        type: string
        meta: { dimension_group: organization }
      - name: organization_name
        title: 组织
        description: 员工在记录时点所属的事业部级组织。
        sql: organization_name
        type: string
        meta: { dimension_group: organization }
      - name: department_name
        title: 部门
        description: 统计记录所属的部门。
        sql: department_name
        type: string
        meta: { dimension_group: organization }
    measures:
      - name: planned_headcount
        title: 计划编制
        description: 所选月份各部门计划配置的员工人数。
        type: sum
        sql: planned_headcount
        meta:
          metric_domain_id: metric_domain:headcount_plan
          time_contract: { aggregation: last, window: selected }
