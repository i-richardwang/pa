cubes:
  - name: employee_fact_base
    title: 通用人员事实模板
    public: false
    description: 为公开演示事实复用时间、组织、雇佣与岗位属性合同。
    meta: { model_role: template }
    sql: "SELECT * FROM read_parquet('/semantic/current/employee_month_snapshot_fact.parquet')"
    dimensions:
      - name: record_key
        sql: record_key
        type: string
        primary_key: true
        public: false
        meta: { internal: true, member_role: relationship_key }
      - name: employee_id
        title: 员工编号
        description: 公开演示数据中的虚构员工编号。
        sql: employee_id
        type: string
        public: false
        meta: { internal: true, member_role: restricted_detail }
      - name: employee_name
        title: 员工姓名
        description: 公开演示数据中的虚构员工姓名。
        sql: employee_name
        type: string
        public: false
        meta: { internal: true, member_role: restricted_detail }
      - name: year
        title: 年
        description: 数据记录所属的自然年。
        sql: year
        type: number
        public: false
        meta: { internal: true, member_role: time_control }
      - name: month
        title: 月
        description: 数据记录所属自然年中的月份序号。
        sql: month
        type: number
        public: false
        meta: { internal: true, member_role: time_control }
      - name: period_month
        title: 月份
        description: 数据记录所属月份的时间轴。
        sql: period_month
        type: time
        public: false
        meta: { internal: true, member_role: time_control }
      - name: record_date
        title: 记录日期
        description: 快照或事件实际发生的日期。
        sql: record_date
        type: time
        public: false
        meta: { internal: true, member_role: restricted_detail }
      - name: legal_entity_name
        title: 法人实体
        description: 员工雇佣关系所属的法人实体。
        sql: legal_entity_name
        type: string
        meta: { dimension_group: organization }
      - name: organization_name
        title: 组织
        description: 员工在记录时点所属的事业部级组织。
        sql: organization_name
        type: string
        meta: { dimension_group: organization }
      - name: department_name
        title: 部门
        description: 统计记录所属的部门。
        sql: department_name
        type: string
        meta: { dimension_group: organization }
      - name: work_location
        title: 工作地点
        description: 员工在记录时点的主要工作地点。
        sql: work_location
        type: string
        meta: { dimension_group: employment }
      - name: employment_type
        title: 雇佣类型
        description: 员工在记录时点属于全职或兼职雇佣。
        sql: employment_type
        type: string
        meta: { dimension_group: employment }
      - name: gender
        title: 性别
        description: 员工在记录时点的性别分类。
        sql: gender
        type: string
        meta: { dimension_group: employee_basic_info }
      - name: age_band
        title: 年龄段
        description: 员工在记录时点按年龄划分的区间。
        sql: age_band
        type: string
        meta: { dimension_group: employee_basic_info }
      - name: age
        title: 年龄
        description: 员工在记录时点的周岁年龄。
        sql: age
        type: number
        public: false
        meta: { internal: true, member_role: calculation_input }
      - name: tenure_band
        title: 司龄段
        description: 员工在记录时点按本次连续雇佣时长划分的区间。
        sql: tenure_band
        type: string
        meta: { dimension_group: employment }
      - name: tenure_years
        title: 司龄
        description: 员工在记录时点本次连续雇佣的年数。
        sql: tenure_years
        type: number
        public: false
        meta: { internal: true, member_role: calculation_input }
      - name: job_family_name
        title: 职族
        description: 员工岗位所属的通用专业类别。
        sql: job_family_name
        type: string
        meta: { dimension_group: job_and_level }
      - name: job_title
        title: 职位名称
        description: 员工在记录时点承担的职位名称。
        sql: job_title
        type: string
        meta: { dimension_group: job_and_level }
      - name: job_level_band
        title: 职级
        description: 员工在记录时点的通用职业发展层级。
        sql: job_level_band
        type: string
        meta: { dimension_group: job_and_level }
      - name: fte
        title: 全职当量
        description: 员工在记录时点相对于一个标准全职岗位的工作量。
        sql: fte
        type: number
        public: false
        meta: { internal: true, member_role: calculation_input }
