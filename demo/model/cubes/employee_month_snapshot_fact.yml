cubes:
  - name: employee_month_snapshot_fact
    title: 员工月末快照
    public: false
    description: 公开演示数据中每名在职员工每月一行的快照事实。
    extends: employee_fact_base
    sql: "SELECT * FROM read_parquet('/semantic/current/employee_month_snapshot_fact.parquet')"
    measures:
      - name: active_employee_count
        title: 在职人数
        description: 所选月末仍在职的虚构员工人数。
        type: count
        meta:
          metric_domain_id: metric_domain:workforce_structure
          report_calculations: [percent_of_total]
          time_contract: { aggregation: last, window: selected }
          underlying_records: { record_set: employee_snapshot, selection: { kind: self } }
      - name: average_age
        title: 平均年龄
        description: 所选月末员工年龄的算术平均值。
        type: avg
        sql: age
        meta:
          metric_domain_id: metric_domain:workforce_structure
          time_contract: { aggregation: last, window: selected }
