services:
  cube:
    image: cubejs/cube:v1.7.1
    ports:
      - "127.0.0.1:${PA_CUBE_PORT:-4000}:4000"
    environment:
      CUBEJS_DB_TYPE: duckdb
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?请在 .env 设置}
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_DEV_MODE: "false"
      CUBEJS_LOG_LEVEL: info
    volumes:
      - ./cube/cube.py:/cube/conf/cube.py:ro
      - ${PA_SEMANTIC_PACKAGE_DIR:-./demo}/model:/cube/conf/model:ro
      - ${PA_SEMANTIC_DATA_DIR:-./data/semantic_data}:/semantic:ro
    restart: unless-stopped

  server:
    build: ./server
    ports:
      # 默认只对本机开放；确需局域网接入时显式设置 PA_SERVER_BIND_IP 并启用鉴权。
      - "${PA_SERVER_BIND_IP:-127.0.0.1}:${PA_SERVER_PORT:-8788}:8788"
    environment:
      CUBE_URL: http://cube:4000
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?请在 .env 设置}
      PA_CUBE_REQUEST_TIMEOUT_MS: ${PA_CUBE_REQUEST_TIMEOUT_MS:-}
      PORT: 8788
      PA_BIND_HOST: ${PA_BIND_HOST:-0.0.0.0}
      # 鉴权基座（Better Auth）：设置 PA_AUTH_SECRET 即启用 OAuth 与 API key 两条接入通道；
      # 公网部署时 PA_BASE_URL 改为对外 HTTPS 地址
      PA_AUTH_SECRET: ${PA_AUTH_SECRET:-}
      # 鉴权 fail-closed：基座未配置时服务拒绝启动；PA_ALLOW_OPEN=1 显式接受当前可达范围无鉴权
      PA_ALLOW_OPEN: ${PA_ALLOW_OPEN:-}
      PA_ALLOWED_ORIGINS: ${PA_ALLOWED_ORIGINS:-}
      PA_BASE_URL: ${PA_BASE_URL:-http://127.0.0.1:8788}
      PA_AUTH_DB: /app/data/auth.db
      PA_APP_DB: /app/data/app.db
      PA_SEMANTIC_PACKAGE_DIR: /semantic-package
    volumes:
      - ${PA_SERVER_DATA_DIR:-./server/data}:/app/data
      - ${PA_SEMANTIC_PACKAGE_DIR:-./demo}:/semantic-package:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    depends_on:
      - cube
    restart: unless-stopped

  # Seed 与 server 在同一容器侧写入 app.db，保持 SQLite WAL 写者协调在同一内核内。
  seed:
    build:
      context: ./server
      target: build
    profiles: ["tools"]
    environment:
      CUBE_URL: http://cube:4000
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?请在 .env 设置}
      PA_APP_DB: /app/data/app.db
      PA_SEMANTIC_PACKAGE_DIR: /semantic-package
    volumes:
      - ${PA_SERVER_DATA_DIR:-./server/data}:/app/data
      - ${PA_SEMANTIC_PACKAGE_DIR:-./demo}:/semantic-package:ro
    entrypoint: ["bun", "scripts/seed_demo.ts"]
    depends_on:
      - cube
